site_name: Seller Exchange — База знаний
site_description: Внутренняя wiki по продукту Seller Exchange (AmazonService / AS)
site_url: https://elviradesign-ux.github.io/as-knowledge-base/
repo_url: https://github.com/elviradesign-ux/as-knowledge-base
repo_name: as-knowledge-base
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji

exclude_docs: |
  .DS_Store
  *.en.md
  *.uk.md

